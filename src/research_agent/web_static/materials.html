<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>材料中心 · 溯光 Lumitrace</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260818-perf10" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebarMount"></div>
      <main class="main-column">
        <header class="topbar">
          <div class="topbar-left"><h1>材料中心</h1></div>
          <div class="topbar-actions"><div class="search-box"><span id="globalSearchIcon"></span><input id="query" type="search" placeholder="搜索材料标题、文件名或内容" /></div></div>
        </header>

        <div class="page-content">
          <section class="page-heading">
            <div><h1>材料中心 <span class="heading-spark">●</span></h1><p>统一管理项目材料、解析状态、版本和可追溯原文。</p></div>
          </section>

          <div class="materials-layout">
            <div>
              <div class="toolbar">
                <select id="projectSelect" aria-label="当前项目"></select>
                <input id="files" type="file" multiple hidden />
                <button id="chooseFiles" class="button primary" type="button"><span id="uploadIcon"></span>上传材料</button>
                <button id="search" class="button secondary" type="button">搜索内容</button>
                <select id="statusFilter" aria-label="状态筛选"><option value="">全部状态</option></select>
                <select id="tierFilter" aria-label="来源等级"><option value="">全部等级</option><option value="S">S · 一手权威</option><option value="A">A · 头部机构</option><option value="B">B · 专业材料</option><option value="D">D · 低可信</option><option value="unclassified">未分类</option></select>
                <button id="refresh" class="icon-button" type="button" title="刷新"></button>
              </div>
              <div id="message" class="muted" style="min-height:24px"></div>
              <div id="summary" class="source-summary"></div>
              <section class="panel table-scroll">
                <table class="data-table">
                  <thead><tr><th>材料标题和原始文件名</th><th>状态</th><th>版本</th><th>来源等级</th><th>更新时间</th><th>操作</th></tr></thead>
                  <tbody id="sources"></tbody>
                </table>
                <div id="empty" class="empty hidden"><span class="empty-symbol">◇</span><strong>暂无材料</strong><p>上传研究材料后，系统会自动解析、OCR 并建立检索索引。</p><button class="button primary" type="button" data-choose-files>上传第一份材料</button></div>
              </section>
            </div>

            <aside class="panel inspector">
              <div class="panel-header"><h2 id="inspectorTitle">材料详情</h2><button id="closeInspector" class="icon-button" type="button" title="清空预览"></button></div>
              <div id="inspectorBody" class="inspector-body"><div class="empty compact"><span class="empty-symbol">◇</span><strong>选择一份材料</strong><p>查看正文、解析警告和元数据。</p></div></div>
            </aside>
          </div>
        </div>
      </main>
    </div>

    <div id="editDrawer" class="drawer-backdrop" aria-hidden="true">
      <aside class="drawer" role="dialog" aria-modal="true">
        <div class="drawer-header"><div><h2>编辑材料信息</h2><p class="muted" id="editFilename"></p></div><button id="closeEdit" class="icon-button" type="button"></button></div>
        <form id="editForm" class="drawer-form">
          <input id="editSourceId" type="hidden" />
          <label><span>材料标题</span><input id="editTitle" required /></label>
          <label><span>来源等级</span><select id="editTier"><option value="S">S · 一手权威材料</option><option value="A">A · 头部研究机构</option><option value="B">B · 专业材料</option><option value="D">D · 低可信材料</option><option value="unclassified">未分类</option></select></label>
          <div class="drawer-actions"><button id="cancelEdit" class="button secondary" type="button">取消</button><button id="saveEdit" class="button primary" type="submit">保存修改</button></div>
        </form>
      </aside>
    </div>
  <script src="/static/ui.js?v=20260818-perf10"></script>
    <script src="/static/materials.js?v=20260818-perf10"></script>
  </body>
</html>
